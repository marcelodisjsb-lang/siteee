
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma pergunta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section id="primeira">
            <h1>Oii clique aq</h1>
            <button onclick="avancar()">Clique aqui</button>
        </section>

        <section id="segunda" class="escondida">
            <h1>se pa eu vou ai amanha, vc vai estar?</h1>

            <div class="botoes">
                <button onclick="responderSim()">SIM</button>
                <button onclick="responderNao()">NÃO</button>
            </div>
        </section>

        <section id="terceira" class="escondida">
            <h1>chata</h1>
        </section>
    </main>

    <script>
        function avancar() {
            trocarTela("primeira", "segunda");
        }

        function responderNao() {
            trocarTela("segunda", "terceira");
        }

        function responderSim() {
            const numero = "5512996212935";
            const mensagem = "Sim, Vou estar";
            const link = "https://wa.me/" + numero +
                "?text=" + encodeURIComponent(mensagem);

            window.open(link, "_blank");
        }

        function trocarTela(atual, proxima) {
            document.getElementById(atual).classList.add("saindo");

            setTimeout(() => {
                document.getElementById(atual).classList.add("escondida");
                document.getElementById(atual).classList.remove("saindo");

                document.getElementById(proxima).classList.remove("escondida");
                document.getElementById(proxima).classList.add("mostrar");
            }, 400);
        }
    </script>

</body>
</html>
